<!DOCTYPE html>
<html>
<head>
  <title>AR FBX 图像跟踪</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  
  <script src="https://cdn.jsdelivr.net/npm/mind-ar/dist/mindar-image-aframe.prod.js"></script>
  
  <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>

  <style>
    /* 用于覆盖全屏的启动按钮 */
    #startButtonContainer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.7);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10001; /* 确保在最上层 */
      cursor: pointer;
    }
    #startButton {
      font-size: 1.5em;
      padding: 15px 30px;
      border: none;
      border-radius: 10px;
      background-color: #fff;
    }

    /* MindAR 默认的扫描 UI (可选) */
    #scanningOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: transparent; /* 透明背景 */
      z-index: 10000;
    }
    .mindar-ui-scanning .mindar-ui-scanning-overlay {
       /* 扫描动画的样式 */
       border: dashed 2px white;
    }
  </style>
</head>

<body>
  
  <div id="startButtonContainer">
    <button id="startButton">点击进入 AR</button>
  </div>

  <div id="scanningOverlay" style="display: none;">
    <div class="mindar-ui-scanning">
      <div class="mindar-ui-scanning-overlay"></div>
    </div>
  </div>

  <a-scene 
    mindar-image="imageTargetSrc: ./target/龙.mind; autoStart: false; uiStarting: #startButtonContainer; uiScanning: #scanningOverlay;"
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <a-asset-item id="myModel" src="./SM_Fish3.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0">
      
      <a-entity
        gltf-model="#myModel"
        animation-mixer="clip: *"
        position="0 0 0"
        scale="0.1 0.1 0.1"
        rotation="0 0 0"
      >
      </a-entity>
    </a-entity>

  </a-scene>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const startButton = document.querySelector('#startButton');
      const scene = document.querySelector('a-scene');
      
      startButton.addEventListener('click', () => {
        // 按钮点击后，手动启动 MindAR 场景
        // MindAR 会自动隐藏 'uiStarting' (startButtonContainer)
        scene.systems['mindar-image'].start();
      });
    });
  </script>
</body>
</html>
